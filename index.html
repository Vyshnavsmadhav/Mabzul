<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MABZUL® | Only What’s Worth Sharing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #550818;
      --maroon-dark: #3a040f;
      --bg-cream: #FAF7F5;
      --border-maroon: rgba(85, 8, 24, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--maroon);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      user-select: none;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.2rem 4.5rem;
      position: relative;
      z-index: 20;
    }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--maroon);
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: opacity 0.2s ease;
    }

    .nav-link:hover {
      opacity: 0.7;
    }

    .brand-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--maroon);
      text-transform: uppercase;
      text-decoration: none;
      margin-right: -0.22em;
    }

    .hero-center {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
      padding: 1.5rem 1.5rem;
      overflow: hidden;
    }

    .hero-headline {
      font-size: clamp(2.5rem, 7.8vw, 7.8rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--maroon);
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: clamp(0.8rem, 2vw, 2.2rem);
      margin: 0;
      white-space: nowrap;
    }

    .image-box {
      display: inline-block;
      width: clamp(65px, 8.5vw, 130px);
      height: clamp(65px, 8.5vw, 130px);
      flex-shrink: 0;
      position: relative;
      vertical-align: middle;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 12px 30px -4px rgba(85, 8, 24, 0.3), 0 0 0 1px rgba(85, 8, 24, 0.08);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .image-box:hover {
      transform: scale(1.08);
      box-shadow: 0 16px 36px -4px rgba(85, 8, 24, 0.45);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
      z-index: 15;
      padding: 0 1.5rem;
    }

    .tagline-sub {
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.55;
      color: var(--maroon);
      max-width: 520px;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    .btn-explore {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 2.2rem;
      border: 1px solid var(--border-maroon);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--maroon);
      text-transform: uppercase;
      text-decoration: none;
      background: transparent;
      transition: all 0.25s ease;
    }

    .btn-explore:hover {
      background: var(--maroon);
      color: var(--bg-cream);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.8rem 4.5rem;
      position: relative;
      z-index: 20;
    }

    .copyright {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--maroon);
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-shop {
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.65rem 1.4rem;
      border: 1px solid var(--border-maroon);
      background: transparent;
      color: var(--maroon);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn-shop:hover {
      background: rgba(85, 8, 24, 0.06);
    }

    .dots-icon {
      font-family: serif;
      font-size: 0.95rem;
      letter-spacing: 2px;
      line-height: 1;
    }

    .btn-menu {
      width: 42px;
      height: 42px;
      background: var(--maroon);
      border: none;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-menu:hover {
      background: var(--maroon-dark);
    }

    .btn-menu span {
      display: block;
      width: 15px;
      height: 2px;
      background: var(--bg-cream);
      border-radius: 1px;
    }

    .btn-menu span:last-child {
      width: 9px;
      align-self: flex-start;
      margin-left: 13.5px;
    }

    @media (max-width: 860px) {
      header {
        padding: 1.6rem 2rem;
      }
      footer {
        padding: 1.6rem 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#story" class="nav-link">Our Story</a>
    <a href="#" class="brand-logo">&middot;MABZUL&reg;</a>
    <a href="#contact" class="nav-link">Contact</a>
  </header>

  <main class="hero-center">
    <h1 class="hero-headline">
      <span>Only What’s</span>
      <span class="image-box">
        <img src="/dates-chocolate.jpg" alt="Pistachio stuffed dates drizzled with dark chocolate">
      </span>
      <span>Worth Sharing</span>
    </h1>
  </main>

  <section class="hero-bottom">
    <p class="tagline-sub">
      Curated dates, nuts and chocolates<br>
      for everyday indulgence and meaningful gifting.
    </p>
    <a href="#explore" class="btn-explore">EXPLORE COLLECTIONS</a>
  </section>

  <footer>
    <div class="copyright">MABZUL&reg; 2026</div>
    <div class="actions-group">
      <button class="btn-shop">
        <span>SHOP NOW</span>
        <span class="dots-icon">::</span>
      </button>
      <button class="btn-menu" aria-label="Toggle navigation menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </footer>
</body>
</html>
